version: '3.8'

services:
  main_app_web:
    build:
      context: ../../pokemon-frontend
      dockerfile: .tr-codegen/Dockerfile
    image: pokemon-frontend:latest
    ports:
      - "3001:80"
    networks:
      - pokemon-network
    depends_on:
      - main_app_pokemon-backend

  main_app_pokemon-backend:
    build:
      context: ..
      dockerfile: .tr-codegen/Dockerfile
    container_name: main_app_pokemon
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pokemon-network

networks:
  pokemon-network:
    driver: bridge